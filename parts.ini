#sudo ln -s /var/www/parts/parts.ini /etc/uwsgi/apps-enabled/
[uwsgi]
module = server:app
chdir = /var/www/parts
virtualenv = /var/www/parts/venv
plugins = python3
socket = /run/parts/parts.sock
chmod-socket = 660
chown-socket = andrew:www-data
processes = 2
master = true
vacuum = true
die-on-term = true
touch-reload = /tmp/parts.touchme
