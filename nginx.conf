#sudo ln -s /var/www/parts/nginx.conf /etc/nginx/sites-enabled/parts.conf
server {
    listen 80;
    server_name acmm57.pullrope.net;
    # Never serve version control or hidden files, even inside published apps
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Parts application: Flask behind uWSGI
    location = /parts {
        include uwsgi_params;
        uwsgi_pass unix:/run/parts/parts.sock;
    }

}
